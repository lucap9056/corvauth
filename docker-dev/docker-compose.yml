name: corvauth

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth_password
      POSTGRES_DB: auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-provider:
    build: ../server/test-provider
    image: corvauth-test-provider:local
    ports:
      - "5556:5556"
    environment:
      ISSUER_URL: "http://test-provider:5556"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5556/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 5

  corvauth:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: corvauth:local
    ports:
      - "8080:80"
    environment:
      DATABASE_URL: "postgres://auth:auth_password@postgres:5432/auth?sslmode=disable"
      REDIS_URL: "redis://redis:6379"
      OIDC_ISSUER_URL: "http://test-provider:5556"
      OAUTH2_CLIENT_ID: "corvauth"
      OAUTH2_CLIENT_SECRET: "corvauth-secret"
      OAUTH2_REDIRECT_URL: "http://localhost:8080/callback"
      OAUTH2_SCOPES: "openid,profile,email"
      DB_AUTO_CREATE_SCHEMA: "true"
      HTTP_MODE: "development"
      ALLOW_REGISTRATION: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      test-provider:
        condition: service_healthy

volumes:
  postgres_data:

# -------------------------------------------------------------------
# Start:
#   docker compose -f docker-dev/docker-compose.yml up --build -d
#
# Run E2E tests (in server/):
#   go test -v ./tests/e2e/
#
# Fixed test user (auto-login, no credentials needed):
#   sub:   test-user-001
#   email: user@example.com
#   name:  Test User
# -------------------------------------------------------------------
